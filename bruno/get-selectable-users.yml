info:
  name: get-selectable-users
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/api/user/get-selectable-users?email={{email}}"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: email
      value: "{{email}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
