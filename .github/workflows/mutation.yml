name: Mutation Tests

on:
  schedule:
    - cron: '0 4 * * *' # nightly 04:00 UTC — after the e2e nightly (03:00)
  workflow_dispatch: # manual run of the mutation baseline

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ADVISORY mutation testing over pure-logic scope (lib/, app/stores|composables|utils).
  # stryker.config.json has `break: null` → the run never fails on score; a job failure
  # here means infra (install/boot), not test quality. Ratchet `break` later once a
  # baseline score is known, mirroring the coverage-gate waves.
  mutation:
    name: Stryker mutation (pure logic, advisory)
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Reuse the previous run's mutant results so unchanged code is skipped. Key is
      # per-branch; falls back to develop's cache so feature branches start warm.
      - name: Restore Stryker incremental cache
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}
          restore-keys: |
            stryker-incremental-develop

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
