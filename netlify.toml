# Netlify Edge Functions Configuration
# This configuration runs ONLY the edge function proxy
# The actual site is deployed to GitHub Pages

[[edge_functions]]
  function = "api-proxy"
  path = "/api/*"

[[edge_functions]]
  function = "api-proxy"
  path = "/chatHub"

[[edge_functions]]
  function = "api-proxy"
  path = "/chatHub/*"

# Build settings (not used since we're only using edge functions)
[build]
  publish = "public"
  command = "mkdir -p public && echo 'Edge functions only - API proxy active' > public/index.html"

# Headers for all responses (optional, edge function adds these)
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://harkairt.github.io"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Requested-With, X-Request-Id, X-Client-Timestamp, X-Client-User-Agent, X-App-Version, X-Debug-Mode, Cache-Control, Pragma"
    Access-Control-Allow-Credentials = "true"

[[headers]]
  for = "/chatHub/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://harkairt.github.io"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Requested-With, X-Request-Id, X-Client-Timestamp, X-Client-User-Agent, X-App-Version, X-Debug-Mode, X-SignalR-User-Agent, Cache-Control, Pragma"
    Access-Control-Allow-Credentials = "true"
